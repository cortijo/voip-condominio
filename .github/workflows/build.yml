name: Build APK

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Compilar APK (debug)
        shell: bash
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log || {
            grep -E "^e: |error:|What went wrong|Could not|FAILED|Execution failed|> " build.log | head -40 | while IFS= read -r l; do echo "::error::${l:0:400}"; done
            exit 1
          }

      - uses: actions/upload-artifact@v4
        with:
          name: interfone-virtual-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Publicar release (apenas em tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/*.apk
