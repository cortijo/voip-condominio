services:
  interfone-server:
    build:
      context: ./server
      # usa a rede do servidor durante o build (evita falha de acesso à internet pela ponte do Docker)
      network: host
    container_name: interfone-server
    restart: unless-stopped
    ports:
      - "9670:9670"   # HTTP (app dos moradores)
      - "9671:9671"   # HTTPS (painel do operador com telefone/microfone)
    environment:
      # Usados somente na PRIMEIRA execução, para criar o administrador primário.
      # Se ADMIN_PASSWORD ficar vazio (ou < 8 caracteres), uma senha aleatória é gerada
      # e exibida UMA vez em "docker logs interfone-server".
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # Defina como 1 se houver um proxy reverso (nginx/Caddy) na frente.
      TRUST_PROXY: ${TRUST_PROXY:-0}
      # IP/domínio pelo qual o painel é acessado (entra no certificado HTTPS autoassinado). Ex: 45.224.165.42
      PUBLIC_HOST: ${PUBLIC_HOST:-}
      HTTPS_PORT: 9671
    volumes:
      - interfone-data:/data

volumes:
  interfone-data:
